apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flashshield-api-hpa
  namespace: flashshield
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flashshield-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
