<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>University Examination Portal | FlashShield</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 400px; border: 1px solid #334155; }
    h2 { margin-top: 0; color: #38bdf8; }
    input { width: 100%; padding: 12px; margin: 12px 0; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .result { margin-top: 20px; padding: 16px; border-radius: 8px; background: #0f172a; border-left: 4px solid #38bdf8; font-size: 14px; display: none; line-height: 1.6; }
    .meta { font-size: 12px; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Academic Results Portal</h2>
    <div class="meta">Cluster Node: <b>{{ pod }}</b></div>
    <input type="text" id="roll" placeholder="Enter Registration No (e.g. 21BCE1001)" />
    <button onclick="fetchResult()">Check Grade Sheet</button>
    <div id="output" class="result"></div>
  </div>

  <script>
    async function fetchResult() {
      const roll = document.getElementById('roll').value.trim() || '21BCE1001';
      const resBox = document.getElementById('output');
      resBox.style.display = 'block';
      resBox.innerHTML = '<span style="color:#94a3b8;">Querying gateway...</span>';

      try {
        const res = await fetch(`/api/result?roll_no=${encodeURIComponent(roll)}`);
        if (res.status === 429) {
          window.location.href = '/static/waiting-room.html';
          return;
        }
        const data = await res.json();
        resBox.innerHTML = `
          <strong>Status:</strong> ${data.data}<br>
          <strong>Lookup Layer:</strong> <span style="color:#4ade80;">${data.source}</span><br>
          <strong>Roundtrip Latency:</strong> ${data.latency_ms} ms<br>
          <strong>Serving Pod:</strong> ${data.served_by_pod}
        `;
      } catch (err) {
        resBox.innerHTML = '<span style="color:#f87171;">Gateway error. Circuit breaker triggered or host unreachable.</span>';
      }
    }
  </script>
</body>
</html>
